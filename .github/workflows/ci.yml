# CI 骨架（T-004 交付物）——四步：装依赖 → ruff check → ruff format --check → pytest
# 门禁渐进启用（development-plan PLN-7）：迁移漂移（T-005 后）、check --deploy（T-031）、
# Playwright（T-029）、docker build（T-033）随对应任务逐道加入
# 第三方 Action 按 commit SHA 固定（全局约束 2：防标签移位的供应链风险）

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: 配置 Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements/dev.txt
      - name: 门禁 1｜ruff check
        run: ruff check .
      - name: 门禁 2｜ruff format --check
        run: ruff format --check .
      - name: 门禁 3｜pytest
        run: pytest
